name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          for f in web/*.js tools/*.js; do
            node --check "$f" || exit 1
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q generate.py build_boards.py tools/

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test API contract
        run: node tools/smoke_test_api.js tests/fixtures/netdaq-small.json

      - name: Board payload generation
        run: |
          python generate.py tests/fixtures/netdaq-small.json --split -o out/board.json
          test -s out/board.json

      - name: Incremental board build
        run: |
          mkdir -p exports/boardA
          cp tests/fixtures/netdaq-small.json exports/boardA/boardA.json
          python build_boards.py --src exports --out built
          test -s built/boardA/boardA.json

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build viewer shell
        run: |
          python generate.py --build-viewer -o out/viewer.html
          test -s out/viewer.html

      - name: Build self-contained viewer
        run: |
          python generate.py tests/fixtures/netdaq-small.json -o out/board.html
          test -s out/board.html

      - name: Licence notices must survive into generated output
        run: |
          grep -q "InteractiveHtmlBom" out/board.html
          grep -q "Permission is hereby granted" out/board.html

      - name: Build docker image
        run: docker build -f docker/Dockerfile -t pcb-viewer:ci .

      - uses: actions/upload-artifact@v7
        with:
          name: viewer
          path: out/
          retention-days: 7

  browser:
    name: Browser
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build page under test
        run: python generate.py tests/fixtures/netdaq-small.json -o tests/browser/board.html

      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # main pushes publish :latest, v* tags publish the version. Both get :sha-<short>.
  publish:
    name: Publish image
    if: github.event_name == 'push'
    needs: [checks, smoke, build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gherkin/htmlpcbviewer
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
