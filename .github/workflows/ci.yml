name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          for f in web/*.js tools/*.js; do
            node --check "$f" || exit 1
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q generate.py build_boards.py tools/

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test API contract
        run: node tools/smoke_test_api.js tests/fixtures/netdaq-small.json

      - name: Board payload generation
        run: |
          python generate.py tests/fixtures/netdaq-small.json --split -o out/board.json
          test -s out/board.json

      - name: Incremental board build
        run: |
          mkdir -p exports/boardA
          cp tests/fixtures/netdaq-small.json exports/boardA/boardA.json
          python build_boards.py --src exports --out built
          test -s built/boardA/boardA.json

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build viewer shell
        run: |
          python generate.py --build-viewer -o out/viewer.html
          test -s out/viewer.html

      - name: Build self-contained viewer
        run: |
          python generate.py tests/fixtures/netdaq-small.json -o out/board.html
          test -s out/board.html

      - name: Licence notices must survive into generated output
        run: |
          grep -q "InteractiveHtmlBom" out/board.html
          grep -q "Permission is hereby granted" out/board.html

      - name: Build docker image
        run: docker build -f docker/Dockerfile -t pcb-viewer:ci .

      - uses: actions/upload-artifact@v7
        with:
          name: viewer
          path: out/
          retention-days: 7

  browser:
    name: Browser
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        env:
          PERF_WALLCLOCK_OUT: perf/wall-clock.json

      # Test table on the run summary page (#29). annotate_only writes
      # annotations and the job summary without creating a check run, so it
      # needs no checks: write and also works on PRs from forks.
      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: test-results/junit.xml
          check_name: Browser tests
          annotate_only: true
          require_tests: true
          include_passed: true
          detailed_summary: true
          group_suite: true
          include_time_in_summary: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: wall-clock
          path: perf/wall-clock.json
          if-no-files-found: error
          retention-days: 7

  # Wall-clock render numbers per commit (#18). History lives on the
  # perf-history branch, one file per commit on main. Fails only on a 10x
  # change, since hosted runners are noisy. Main pushes record even when the
  # check fails, so a deliberate change becomes the new median after a few
  # commits. publish does not wait for it, so a failure here never blocks a
  # release.
  perf-trend:
    name: Perf trend
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/download-artifact@v8
        with:
          name: wall-clock
          path: perf/

      - name: Check out history
        run: |
          if git ls-remote --exit-code --heads origin perf-history; then
            git fetch --depth=50 origin perf-history:perf-history
            git worktree add history perf-history
          else
            git worktree add --orphan -b perf-history history
          fi

      - name: Compare with history
        id: check
        run: node tools/perf_trend.js check perf/wall-clock.json history/runs

      - name: Record on main
        if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        run: |
          node tools/perf_trend.js record perf/wall-clock.json history/runs \
            "$GITHUB_SHA" "$(git log -1 --format=%cI)"
          git -C history config user.name 'github-actions[bot]'
          git -C history config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C history add runs
          # A re-run of the same commit replaces its file, possibly unchanged.
          git -C history diff --cached --quiet && exit 0
          git -C history commit -q -m "perf: ${GITHUB_SHA::12}"
          # Each commit adds its own file, so a rebase over a concurrent run
          # only conflicts when both recorded the same commit. Then this run's
          # file wins, as on a re-run.
          for i in 1 2 3; do
            git -C history push origin perf-history && exit 0
            git -C history pull -q --rebase -X theirs origin perf-history
          done
          exit 1

  # Full netdaq board for the demo, generated from the KiCad source. Same pin
  # as tests/fixtures/README.md. Runs on PRs too, so a break shows up before
  # main.
  demo-board:
    name: Demo board
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Gherkin/netdaq
          ref: e476a90996112e948fbc02550b53fd4876b7232d
          path: netdaq

      - uses: actions/checkout@v7
        with:
          repository: openscopeproject/InteractiveHtmlBom
          ref: 5c192e794cd66fde04bab11810601b711bf8581b
          path: ibom

      # pcbnew prints over a thousand assert warnings to stderr. Keep them out
      # of the log unless the run fails.
      - name: Generate board JSON
        env:
          IBOM_PATH: ${{ github.workspace }}/ibom
        run: |
          python3 tools/make_fixture.py netdaq/netdaq.kicad_pcb out/netdaq.json 2> make_fixture.log \
            || { cat make_fixture.log; exit 1; }
          test -s out/netdaq.json

      - uses: actions/upload-artifact@v7
        with:
          name: demo-board
          path: out/netdaq.json
          retention-days: 7

  # Demo on GitHub Pages (#4): the self-contained viewer with the full netdaq
  # board inlined. Pages source must be "Deploy from a branch: gh-pages" (#33).
  # The main demo is the branch root. PR previews live under pr-preview/, so
  # clean-exclude keeps them, and force: false rebases over a preview pushed
  # at the same time.
  pages:
    name: Publish demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, smoke, build, browser, demo-board]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          name: demo-board
          path: board/

      - name: Build demo page
        run: |
          mkdir -p site
          python generate.py board/netdaq.json -o site/index.html
          test -s site/index.html
          touch site/.nojekyll

      # The large board for checking speed. Not linked from anywhere; its
      # licence asks for AUTHORS and the conditions to go with it.
      - name: Build CIAA-ACC page
        run: |
          mkdir -p site/ciaa-acc
          python generate.py tests/fixtures/ciaa-acc.json -o site/ciaa-acc/index.html
          test -s site/ciaa-acc/index.html
          cp tests/fixtures/ciaa-acc/LICENSE tests/fixtures/ciaa-acc/AUTHORS.md site/ciaa-acc/

      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false
          commit-message: 'demo: ${{ github.sha }}'

  # Demo built from the PR branch at pr-preview/pr-<N>/ on gh-pages, linked
  # in a sticky PR comment (#33). PRs from forks are skipped: their token can't
  # push. pr-preview.yml removes the preview when the PR is closed.
  pr-preview:
    name: PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: demo-board
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          name: demo-board
          path: board/

      - name: Build demo page
        run: |
          mkdir -p site
          python generate.py board/netdaq.json -o site/index.html
          test -s site/index.html

      - name: Build CIAA-ACC page
        run: |
          mkdir -p site/ciaa-acc
          python generate.py tests/fixtures/ciaa-acc.json -o site/ciaa-acc/index.html
          test -s site/ciaa-acc/index.html
          cp tests/fixtures/ciaa-acc/LICENSE tests/fixtures/ciaa-acc/AUTHORS.md site/ciaa-acc/

      # The action's own comment has no room for a second link, so post our
      # own under the same header. preview-url ends with a slash.
      - id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          action: deploy
          comment: false
          qr-code: false
          wait-for-pages-deployment: true

      - if: steps.preview.outputs.deployment-action == 'deploy'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          message: |
            PR preview, built from ${{ github.event.pull_request.head.sha }}:

            - netdaq: ${{ steps.preview.outputs.preview-url }}
            - CIAA-ACC: ${{ steps.preview.outputs.preview-url }}ciaa-acc/

  # main pushes publish :latest, v* tags publish the version. Both get :sha-<short>.
  publish:
    name: Publish image
    if: github.event_name == 'push'
    needs: [checks, smoke, build, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gherkin/htmlpcbviewer
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
