name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  checks:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          for f in web/*.js tools/*.js; do
            node --check "$f" || exit 1
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q generate.py build_boards.py tools/

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test API contract
        run: node tools/smoke_test_api.js tests/fixtures/netdaq-small.json

      - name: Board payload generation
        run: |
          python generate.py tests/fixtures/netdaq-small.json --split -o out/board.json
          test -s out/board.json

      - name: Incremental board build
        run: |
          mkdir -p exports/boardA
          cp tests/fixtures/netdaq-small.json exports/boardA/boardA.json
          python build_boards.py --src exports --out built
          test -s built/boardA/boardA.json

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build viewer shell
        run: |
          python generate.py --build-viewer -o out/viewer.html
          test -s out/viewer.html

      - name: Build self-contained viewer
        run: |
          python generate.py tests/fixtures/netdaq-small.json -o out/board.html
          test -s out/board.html

      - name: Licence notices must survive into generated output
        run: |
          grep -q "InteractiveHtmlBom" out/board.html
          grep -q "Permission is hereby granted" out/board.html

      - name: Build docker image
        run: docker build -f docker/Dockerfile -t pcb-viewer:ci .

      - uses: actions/upload-artifact@v7
        with:
          name: viewer
          path: out/
          retention-days: 7

  browser:
    name: Browser
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Build page under test
        run: python generate.py tests/fixtures/netdaq-small.json -o tests/browser/board.html

      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
