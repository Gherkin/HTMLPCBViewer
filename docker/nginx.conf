server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Landing page
  location = / {
    try_files /index.html =404;
  }

  # Shared viewer shell (baked into image)
  location /viewer/ {
    try_files $uri $uri/ /viewer/index.html =404;
  }

  # Board payload JSON files (external volume mount)
  # The board list page reads index.json, written by build_boards.py.
  # The JSON directory listing is kept for other clients.
  location /pcbs/ {
    autoindex on;
    autoindex_format json;
    autoindex_exact_size on;
    charset utf-8;
    try_files $uri $uri/ =404;
  }

  # MCP server for agents: the pcb-mcp service in docker-compose.yml.
  # The name is looked up per request through Docker's DNS, so nginx still
  # starts when that service is left out; /mcp then gives 502.
  location = /mcp {
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;
    set $mcp_upstream http://pcb-mcp:3000;
    proxy_pass $mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replies may come as a server-sent event stream; pass it on as it comes.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location ~ /\. {
    deny all;
  }
}
