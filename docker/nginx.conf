server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Landing page
  location = / {
    try_files /index.html =404;
  }

  # Shared viewer shell (baked into image)
  location /viewer/ {
    try_files $uri $uri/ /viewer/index.html =404;
  }

  # Board payload JSON files (external volume mount)
  # The board list page reads index.json, written by build_boards.py.
  # The JSON directory listing is kept for other clients.
  location /pcbs/ {
    autoindex on;
    autoindex_format json;
    autoindex_exact_size on;
    charset utf-8;
    try_files $uri $uri/ =404;
  }

  location ~ /\. {
    deny all;
  }
}
