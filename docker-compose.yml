services:
  pcb-viewer:
    image: pcb-viewer:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pcb-viewer
    ports:
      - "1010:80"
    volumes:
      - ${PCB_HTML_DIR:-./pcb-viewer-data}:/usr/share/nginx/html/pcbs:ro
    restart: unless-stopped

  # MCP server for agents, reached through the viewer at /mcp. Leave this
  # service out if you do not want it; the viewer runs without it.
  pcb-mcp:
    image: pcb-mcp:latest
    build:
      context: mcp
    container_name: pcb-mcp
    environment:
      # The board list page's address as users open it, for links made by
      # the link tool, e.g. http://pcbhost:1010/. Unset, links start at
      # /viewer/.
      - VIEWER_URL=${VIEWER_URL:-}
    volumes:
      - ${PCB_HTML_DIR:-./pcb-viewer-data}:/pcbs:ro
    restart: unless-stopped
